<script>
    const produtos = []; // forma mais usada para declarar uma array 
    const produto = new array(); // forma menos usada

     const cidade = ["Paracatu"]; // inicializa o vetor, declara e define o conteudo dentro do vetor 

    cidade.push("Unaí"); // adiciona ao final do vetor 
    console.log(cidade); // ["Paracatu" , "Unaí"]

    cidade.unshift("João Pinheiro"); // adiciona ao inicio e desloca os demais 
    console.log(cidade); // ["João Pinheiro" , "Paracatu" , "Unaí" ];

    const ultima = cidade.pop; // remove a ultima cidade do vetor 
    console.log(cidade); // ["João Pinheiro" , "Paracatu"];

    const primeira = cidade.shift(); // Remove a primeira e sobe as demais 
    console.log(cidade); // ["Paracatu"]

</script>
