<script>
    const frutas = ["Maçã", "Banana", "Laranja", "Uva"];

    const resultado = frutas.slice(1, 3);

    console.log(resultado);
    console.log(frutas);

/* 
["Banana", "Laranja"]
["Maçã", "Banana", "Laranja", "Uva"]

slice(início, fim)

O índice fim não é incluído.
*/

const frutas = ["Maçã", "Banana", "Laranja", "Uva"];

frutas.splice(1, 2); // o splice pode remove,adicionar ou substituir o elemento 

console.log(frutas);

/* 
["Maçã", "Uva"]

["Maçã", "Banana", "Laranja", "Uva"]
         ↑         ↑
       remove    remove
*/
</script>
