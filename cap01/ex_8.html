<meta charset="UTF-8">
<script>
    /*Elaborar um programa que leia a duração de uma viagem em dias e horas.
    calcule e informe a duração total da viagem em numeros e horas. 
    */

    const dias = Number(prompt("Quant o dias passou viajando: ")); // aqui fez a leitura na caixa do navegador, armazena dentro da variavel const dias 
    const horas = Number(prompt("Quantas horas você gastou: ")); // aqui fez a leitura na caixa do navegador, armazena dentro da variavel const horas
    const total = (dias * 24) + horas; // aqui faz a operação e armazena dentro da variavel 
    alert(`Total de horas: ${total} horas`); // exibe o valor na tela com o resultado total 
</script>
