<meta charset="UFT-8">
<script>
    /*
    Elaborar um program que leia 2 notas de um aluno em uma disciplina. 
    calcule e informe a média das notas.
    */
    const nota1 = Number(prompt("Digite sua primeira nota: "));//entrada, MOSTRA NA TELA A MSG, CONVERTE PARA "Number" em seguida armazena na variavel nota1
    const nota2 = Number(prompt("Digite a segunda nota: "));//entrada, MOSTRA NA TELA A MSG, CONVERTE PARA "Number" em seguida armazena na variavel nota2
    const media = (nota1 + nota2) / 2;// processamento, faz o calculo dos valores armazenados na variavel nota1 + nota2 em seguida dividi por 2 e armazena na variavel "media"
    alert(`MEDIA: ${media}`);
</script>
