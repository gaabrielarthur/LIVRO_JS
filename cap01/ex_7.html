<meta charset="UTF-8">
<script>
    /*
    Elaborar um programa que leia o valor de uum jantar.
    Calcule e informe o valor da taxa do do garçom(%10)e o valor total a ser pago.
    */

    const jantar = Number(prompt("Qual o valor do jantar R$: ")) // IMPRIMI NA TELA E FAZ A LEITURA
    const taxa = jantar * 0.10 // FAZ O CALCULO 
    const total = taxa + jantar // FAZ O CALCULO DO TOTAL DE TUDO 

    alert(`O VALOR DA CONTA R$${jantar}`) // IMPRIMI O VALOR 
    alert(`TAXA DE GARÇOM R$${taxa}\nTOTAL A PAGAR R$${total}`)    // IMPRIMI O VALOR TOTAL 

</script>
