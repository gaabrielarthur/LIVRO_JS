<meta charset="UTF-8">

<script>
/*
Elabore um programa que leia dois números. calcule e informe a soma desses numeros
*/
const n1 = Number(prompt("Digite o primeiro número:")) // faz a  leitura 
    const n2 = Number(prompt("Digite o segundo número:")) // faz a leitura do segundo numero 
    const soma = n1 + n2 // soma recebe a soma dos dois numeros digitados pelo usuario 
    alert(`soma é: ${soma}`) // imprimi na tela o valor 
</script>
