<meta charset="UFT-8">
<script>
/*
Elaborar um programa para uma pizzaria, o qual leia o valor total de uma conta e 
quantos clientes vão pagá-la.Calcule e informe o valor a ser pago por cliente 
*/

const conta = Number(prompt("Qual foi o valor total da conta: ")); // FAZ A PERGUNTA E ARMAZENA A RESPOSTA NA VARIAVEL CONTA
const Nclientes = Number(prompt("Vai ser dividida por quantas pessoas: "));//FAZ A PERGUNTA E ARMAZENA A RESPOSTA NA VARIAVEL CONTA
const valorDAdivisao = conta / Nclientes;// FAZ O CALCULO BASEADO NO VALOR DIGITADO DO USUARIO EM CADA VARIAVEL, E ARMAZENA NA VARIVAEL valorDAdivisao
alert(`Valor da conta: R$${conta}\nNumero de clientes: ${Nclientes}\nValor que ficou para cada um pagar: R$${valorDAdivisao}\n`);
//imprimi na tela o valor armazenado em cada variavel

</script>
