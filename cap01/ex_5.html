<meta charset="UTF-8">
<script>

    /*
Elaborar um programa que leia um numero. Calcule e informe o dobro desses número.
    */
   
    // calculo do dobro
    const num = prompt("Digite um numero: "); //ENTRADA abre a caixa no navegador, dentro das "" imprimi a msg
    const dobro = num * 2// PROCESSAMENTO FAZ O CALCULO DE NUM x 2 e atribui a variavel dobro 
    alert(dobro) // IMPRIMI O RESULTADO NA TELA PARA O USUARIO 
</script>
