<meta charset="UTF-8">
<script>
/*
Elaborar um programa que leia um numero. 
calcule e informe os seus numeros vizinhos ou seja, o nùmero anterios e posterior 
*/
const numero = Number(prompt("Digite um numero: "));// faz a pergunta em uma caixa do navegador
const numeroanterior = numero - 1;  // faz a operação e armazena na variavel "numeroantearior", valor digitado -1 
const numerosuperior = numero + 1; // faz a operação e armazena na variavel "numerosuperior", valor digitado +1
alert(`NUMERO: ${numero}\n`);//imprimi o numero digitado q foi armazenado na variavel numero
alert(`VIZINHOS: ${numeroanterior} e ${numerosuperior}\n`); // informa os dois valores inferior e superior 





</script>
