<!DOCTYPE html>

    <title>Numero_descrescente</title>

<body>
    <h1>Programa Números Decrescente</h1>
    <form>
        <label for="numero">Número:</label>
            <input type="number" 
            id="number" 
            min="1" 
            max="100" 
            placeholder="Digite um Numero aqui" 
            required>
       <br>
        <input type="submit" value="enviar">
    </form>

    <script src="ex5_2.js"></script>
</body>
</html>
